name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package itself, so the tests can import pose3d
        run: |
          pip install -e ".[dev]"
          pip install --force-reinstall opencv-python-headless    # no display on a runner
      - run: pytest -q
      - name: The committed benchmark is readable and complete
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("validation/benchmark_results.json").read_text())
          stages = ["1_triangulation", "2_bootstrapped", "3_refined"]
          assert set(stages) <= set(d["summary"]), d["summary"].keys()
          for s in stages:
              assert "MPJPE_mm" in d["summary"][s]
          print("benchmark summary present for", len(stages), "stages,", d["seeds"], "seeds")
          PY
